# wlperch — everything sway needs, in one file.
# Install: copy (or symlink) to ~/.config/sway/config.d/ and reload sway.
# Note: sway has no trailing comments; keep comments on their own lines.
# Tweak freely; wlperch itself only adds per-workspace placement rules for
# its placeholder windows at runtime (they depend on your project names).

# ---- Daemon -------------------------------------------------------------
# Start in the background so the CPU/GPU graphs have history when you open it.
exec wlperch daemon

# ---- Panels -------------------------------------------------------------
bindsym $mod+o exec wlperch toggle
# Other panels (see [panel.*] in ~/.config/wlperch/config.ini):
# bindsym $mod+Shift+o exec wlperch toggle system

# ---- Time tracking: project workspaces ----------------------------------
# Project workspaces have names, not numbers, so these act on "the current
# project": the one you're in, else the last used one.
# Go to the project's workspaces (all monitors):
bindsym $mod+p exec wlperch track go
# Send the focused window to the project's workspace on this monitor:
bindsym $mod+Shift+p exec wlperch track move
# Pin the current project for a minute (each move extends it), then roam any
# workspaces and gather misplaced windows with $mod+Shift+p:
bindsym $mod+Ctrl+p exec wlperch track pin

# ---- Placeholder windows (keep empty project workspaces alive) ----------
# The rounded translucent tile and label are drawn by wlperch; this removes
# sway's own decorations around it.
for_window [app_id="wlperch-placeholder"] border none
