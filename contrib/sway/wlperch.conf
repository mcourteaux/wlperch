# wlperch — everything sway needs, in one file.
# Install: copy (or symlink) to ~/.config/sway/config.d/ and reload sway.
# Note: sway has no trailing comments; keep comments on their own lines.
# Tweak freely; wlperch itself only adds per-workspace placement rules for
# its placeholder windows at runtime (they depend on your project names).

# ---- Daemon -------------------------------------------------------------
# Start in the background so the CPU/GPU graphs have history when you open it.
exec wlperch daemon

# ---- Panels -------------------------------------------------------------
# Key bindings open it centred; waybar clicks keep the configured corner.
bindsym $mod+o exec wlperch toggle --center
# The calculator popup (type right away; Escape closes it):
bindsym $mod+equal exec wlperch toggle calc --center
bindsym XF86Calculator exec wlperch toggle calc --center
# The app launcher (apps, sums, panels; "> command" runs one) in place of
# rofi/wofi. "wlperch setup" can switch your existing launcher keys over, or:
# bindsym $mod+d exec wlperch toggle launch --center
# bindsym $mod+Shift+d exec wlperch toggle run --center
# Other panels (see [panel.*] in ~/.config/wlperch/config.ini):
# bindsym $mod+Shift+o exec wlperch toggle system

# ---- Dark / light -------------------------------------------------------
# Switches wlperch, GTK apps, waybar, kitty… (see [theme] in the config):
# bindsym $mod+Shift+t exec wlperch theme toggle

# ---- Bar ----------------------------------------------------------------
# wlperch's own bar in place of waybar (setup's "Bar" card can switch an
# existing bar over). By hand, replace your bar block's program:
# bar {
#     swaybar_command wlperch bar
# }

# ---- Lock screen --------------------------------------------------------
# wlperch lock replaces swaylock (setup's "Lock screen" card can switch an
# existing swaylock setup over). By hand: lock with a key, and from swayidle
# after 5 minutes and before sleep (-f returns once the screen is locked).
# bindsym $mod+Mod1+l exec wlperch lock
# exec swayidle -w timeout 300 'wlperch lock -f' timeout 360 'swaymsg "output * power off"' resume 'swaymsg "output * power on"' before-sleep 'wlperch lock -f' lock 'wlperch lock -f'

# ---- Time tracking: project workspaces ----------------------------------
# Project workspaces have names, not numbers, so these act on "the current
# project": the one you're in, else the last used one.
# Go to the project's workspaces (all monitors):
bindsym $mod+p exec wlperch track go
# Send the focused window to the project's workspace on this monitor:
bindsym $mod+Shift+p exec wlperch track move
# Pin the current project for a minute (each move extends it), then roam any
# workspaces and gather misplaced windows with $mod+Shift+p:
bindsym $mod+Ctrl+p exec wlperch track pin

# ---- Placeholder windows (keep empty project workspaces alive) ----------
# The rounded translucent tile and label are drawn by wlperch; this removes
# sway's own decorations around it.
for_window [app_id="wlperch-placeholder"] border none
